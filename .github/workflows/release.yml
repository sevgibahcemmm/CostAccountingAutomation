name: Release

# Ne zaman calisir?
#   - YALNIZCA elle: Actions sekmesinden "Run workflow" ile (workflow_dispatch).
#
#   Neden push tetikleyicisi kaldirildi? DevExpress lisans dogrulamasi CI'da
#   cozulemediginden her push basarisizlik bildirimi gonderiyordu. Surum
#   yayini artik elle (Actions > Release > Run workflow) baslatilir; push
#   ustune otomatik calisma olmaz, basarisizlik epostasi da gelmez. Pipeline
#   daha sonra lisans sorunu cozulurse elle kullanilabilir.
#
# Akis: surumu artir -> publish -> Inno Setup ile setup.exe -> GitHub Release
#       -> update.json guncelle (yalnizca gecmis kayit; istemciler surum kaydini
#          Master veritabanindaki AppReleases tablosundan okur ve setup.exe'yi
#          sunucunun paylasim klasorunden ceker -> sunucudaki sync-updates.ps1)
#       -> master'a geri commit ([skip ci] ile dongu engellenir).
#
# NOT: GITHUB_TOKEN ile yapilan push'lar yeni workflow tetiklemez ve ayrica
# commit mesajinda [skip ci] vardir; bu yuzden sonsuz dongu olusmaz.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Surum artirma turu'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Release olusturmak ve master'a geri push etmek icin yazma izni gerekir.
permissions:
  contents: write

# Ayni anda tek release calissin; ust uste push'larda surum numarasi karismasin.
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    # Bot kendi commit'inde tekrar tetiklenmesin; istege bagli [no release] ile atlanabilir.
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[no release]')) }}

    # DevExpress resmi dokumanina gore CI'da lisans, ismi tam olarak
    # "DevExpress_License" olan bir cevre degiskeniyle verilir (buyuk/kucuk harf
    # onemli). Sifre : secrets.DEVEXPRESS_LICENSE secret'ina yuklenir.
    env:
      DevExpress_License: ${{ secrets.DEVEXPRESS_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Surumu artir
        id: version
        shell: pwsh
        run: |
          $csproj = 'src/Cost.Accounting.Automation.WinFormsApp/Cost.Accounting.Automation.WinFormsApp.csproj'
          $content = Get-Content -LiteralPath $csproj -Raw
          if ($content -notmatch '<Version>([0-9]+)\.([0-9]+)\.([0-9]+)</Version>') {
            throw 'csproj icinde <Version> bulunamadi.'
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]

          $bump = '${{ github.event.inputs.bump }}'
          if ([string]::IsNullOrWhiteSpace($bump)) { $bump = 'patch' }

          switch ($bump) {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            default { $patch++ }
          }

          $newVersion = "$major.$minor.$patch"

          # Ayni tag zaten yayinlanmissa (yeniden calistirma) bir sonraki patch'e gec.
          # (git tag --list her zaman 0 dondurur; native cikis kodu hatasi olusmaz.)
          while (git tag --list "v$newVersion") {
            $patch++
            $newVersion = "$major.$minor.$patch"
          }

          $content = $content -replace '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>', "<Version>$newVersion</Version>"
          Set-Content -LiteralPath $csproj -Value $content -NoNewline

          Write-Host "Yeni surum: $newVersion"
          "newVersion=$newVersion" >> $env:GITHUB_OUTPUT

      - name: DevExpress lisansini yerlestir
        # GitHub, secrets degiskeninin dogrudan if: icinde kullanilmasina izin
        # vermez; bu yuzden secret env uzerinden verilir ve kontrol script icinde
        # yapilir. Secret yoksa ya da icerik yerel dosyadan farkliysa adim duser.
        shell: pwsh
        env:
          DEVEXPRESS_LICENSE: ${{ secrets.DEVEXPRESS_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEVEXPRESS_LICENSE)) {
            throw 'DEVEXPRESS_LICENSE secret tanimli degil. Repo Settings > Secrets and variables > Actions > New repository secret ile ekleyin.'
          }
          Write-Host "Secret uzunlugu: $($env:DEVEXPRESS_LICENSE.Length) karakter"
          # Yerel Aktif lisans dosyasinin SHA256'si (D6230F6A...).
          # Bu hash eslesmezse secret'a kopyalanan icerik dogru degildir.
          $knownHash = 'D6230F6A0D3B4E0748D3580331ED806A0141917932B3B321F1E3773638F39A19'
          $dir = Join-Path $env:APPDATA 'DevExpress'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'DevExpress_License.txt'
          Set-Content -LiteralPath $file -Value $env:DEVEXPRESS_LICENSE -NoNewline
          if (-not (Test-Path -LiteralPath $file)) {
            throw "Lisans dosyasi yazilamadi: $file"
          }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          Write-Host ("Lisans dosyasi yazildi: {0} ({1} bayt)" -f $file, (Get-Item -LiteralPath $file).Length)
          Write-Host "Yazilan dosya SHA256: $hash"
          if ($hash -ne $knownHash) {
            throw "Lisans icerigi yerel dosyayla eslesmiyor. Dosyayi Notepad'de acin, Ctrl+A, Ctrl+C ile kopyalayin ve secret degerine tekrar yapistirin."
          }
          Write-Host 'Lisans dogrulandi: icerik yerel dosyayla birebir ayni.'

      - name: Publish ve setup olustur
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.newVersion }}'
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/CostAccountingAutomation-Setup-$version.exe"
          ./installer/build-installer.ps1 -Version $version -UpdateUrl $url

      - name: GitHub Release olustur
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.newVersion }}'
          $tag = "v$version"
          $setup = "installer/dist/CostAccountingAutomation-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Setup dosyasi bulunamadi: $setup"
          }
          gh release create $tag $setup `
            --title $tag `
            --notes "Otomatik yayin $tag" `
            --target "${{ github.sha }}"

      - name: Surum ve update.json'i geri commit'le
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "src/Cost.Accounting.Automation.WinFormsApp/Cost.Accounting.Automation.WinFormsApp.csproj" "update.json"
          git commit -m "chore: otomatik surum v${{ steps.version.outputs.newVersion }} [skip ci]"
          git push origin HEAD:master
